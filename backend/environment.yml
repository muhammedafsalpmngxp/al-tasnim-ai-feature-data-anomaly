# Conda env `mycuda` already exists and has most of this. Kept here so the environment is
# reproducible on a fresh machine: `conda env create -f environment.yml` (or use `pip
# install` per package into the existing mycuda env, which is what this project actually
# does -- see README.md).
name: mycuda
channels: [defaults, conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - fastapi
      - uvicorn
      - pydantic
      - pydantic-settings
      - pyodbc
      - pandas
      - numpy
      - scipy
      - python-dotenv
      - openpyxl
      - xlsxwriter
      - python-docx
      - matplotlib
      - openai
      - pyyaml
      - structlog
      - sse-starlette
      - alembic
      - pytest
      - pytest-asyncio
      - httpx
